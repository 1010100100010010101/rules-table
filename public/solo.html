<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>單機試用｜規則仲裁桌</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2226%22 fill=%22%23f5b83d%22/%3E%3Cpath d=%22M50 18v62M32 80h36M24 34h52M24 34l-12 24a12 12 0 0 0 24 0zM76 34l-12 24a12 12 0 0 0 24 0z%22 fill=%22none%22 stroke=%22%231c2433%22 stroke-width=%227%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<meta name="theme-color" content="#233a5e">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="/"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v17M7 20h10M5 7h14M5 7l-3 6a3 3 0 0 0 6 0zM19 7l-3 6a3 3 0 0 0 6 0z"/></svg></span><span data-i18n="appName">規則仲裁桌</span></a>
  <span class="sub" data-i18n="soloNav"></span>
  <span class="spacer"></span>
  <div class="langs" id="langs" role="group" aria-label="Language"></div>
</div></header>

<main>
  <section class="card">
    <label for="game" style="margin-top:0" data-i18n="pickGame"></label>
    <select id="game"></select>
    <div class="seg" id="seg" style="margin-top:14px"><button data-m="duel" class="on" type="button" data-i18n="modeDuel"></button><button data-m="ask" type="button" data-i18n="modeAsk"></button></div>
    <div id="duel">
      <label for="a" data-i18n="claimA"></label><input type="text" id="a" maxlength="120" data-i18n-ph="claimAPh"><div class="cnt" id="ca"></div>
      <label for="b" data-i18n="claimB"></label><input type="text" id="b" maxlength="120" data-i18n-ph="claimBPh"><div class="cnt" id="cb"></div>
    </div>
    <div id="ask" hidden>
      <label for="q" data-i18n="yourQuestion"></label><input type="text" id="q" maxlength="120" data-i18n-ph="questionPh"><div class="cnt" id="cq"></div>
    </div>
    <button class="btn pri block" id="go" type="button" style="margin-top:12px" data-i18n="sendDispute"></button>
  </section>

  <section id="out"></section>

  <section class="card"><details><summary id="hsum"></summary>
    <div id="hl"></div>
    <label for="hnew" data-i18n="addOwn"></label><input type="text" id="hnew" maxlength="120">
    <button class="btn" id="hadd" type="button" style="margin-top:8px" data-i18n="addRule"></button>
    <p class="muted" data-i18n="localHouseNote"></p>
  </details></section>

  <section class="card"><details><summary data-i18n="fullRulebook"></summary><div id="rb" class="muted"></div></details></section>
  <section class="card"><details id="exd"><summary data-i18n="examplesTitle"></summary><div id="ex" class="muted"></div></details></section>
  <p class="muted small"><a href="/" data-i18n="soloFoot"></a></p>
</main>

<script type="module">
import { $, el, renderVerdict, quoteRows, store, wireCounter } from "/assets/common.js";
import { dict, fmt, getLang, applyI18n, langSwitch } from "/assets/i18n.js";

const SAMPLE_ID = "night-market";
let lang = getLang(), t = dict(lang);
let mode = "duel", game = SAMPLE_ID, examples = [];
const loadH = () => store("house_rules") || [];
const saveH = (h) => store("house_rules", h);
function addH(text) { text = String(text).trim().slice(0, 120); if (!text) return; const h = loadH(); if (h.length < 20) { h.push(text); saveH(h); } renderH(); }
function renderH() {
  const h = loadH(); $("hsum").textContent = fmt(t.localHouse, { n: h.length });
  const box = $("hl"); box.replaceChildren();
  if (!h.length) { box.append(el("p", "muted", t.noLocalHouse)); return; }
  h.forEach((text, i) => {
    const r = el("div", "hrow"); r.append(el("span", "cid h", "H" + (i + 1)), el("span", "grow", text));
    const d = el("button", "btn sm", t.del); d.onclick = () => { const x = loadH(); x.splice(i, 1); saveH(x); renderH(); };
    r.append(d); box.append(r);
  });
}
$("hadd").onclick = () => { addH($("hnew").value); $("hnew").value = ""; };

$("seg").onclick = (e) => {
  const m = e.target.dataset?.m; if (!m) return; mode = m;
  [...$("seg").children].forEach((b) => b.classList.toggle("on", b.dataset.m === m));
  $("duel").hidden = m !== "duel"; $("ask").hidden = m !== "ask";
};
wireCounter($("a"), $("ca")); wireCounter($("b"), $("cb")); wireCounter($("q"), $("cq"));

function showErr(d) {
  const box = $("out"); box.replaceChildren(); box.append(el("div", "err", d.message || t.errGeneric));
  if (game === SAMPLE_ID && ["quota_daily", "rate_limited", "no_key"].includes(d.error)) {
    const b = el("button", "btn", t.seeExamples); b.style.marginTop = "8px";
    b.onclick = () => { $("exd").open = true; $("exd").scrollIntoView({ behavior: "smooth" }); };
    box.append(b);
  }
}

function render(d, m) {
  const box = $("out"); box.replaceChildren();
  const c = el("div", "card verdict"); c.dataset.kind = d.kind;
  renderVerdict(c, d, m, {}, t);
  if (d.house_rule_options?.length) {
    c.append(el("div", "subh", t.optHead));
    d.house_rule_options.forEach((o) => {
      const r = el("div", "opt"); r.append(el("p", null, o.text), el("small", null, fmt(t.effect, { e: o.effect || "" })));
      const b = el("button", "btn sm", t.addAsRule); b.style.marginTop = "6px";
      b.onclick = () => { addH(o.text); b.textContent = t.addedRule; b.disabled = true; };
      r.append(b); c.append(r);
    });
  }
  box.append(c); box.scrollIntoView({ behavior: "smooth", block: "start" });
}

$("go").onclick = async () => {
  const body = { mode, claim_a: $("a").value, claim_b: $("b").value, question: $("q").value, house_rules: loadH(), game, lang };
  $("go").disabled = true; $("go").textContent = t.ruling;
  try {
    const r = await fetch("/api/analyze", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const d = await r.json();
    if (r.ok) render(d, mode); else showErr(d);
  } catch { showErr({ message: t.netFail }); }
  finally { $("go").disabled = false; $("go").textContent = t.sendDispute; }
};

function loadRulebook() {
  $("rb").textContent = t.loading;
  fetch(`/api/rulebook?game=${game}&lang=${lang}`).then((r) => r.json()).then((d) => { const b = $("rb"); b.replaceChildren(); quoteRows(b, d.sentences); })
    .catch(() => { $("rb").textContent = t.rbFail; });
}

// 預錄範例只有示例遊戲有，而且要跟介面語言一致
function renderExamples() {
  const box = $("ex"); box.replaceChildren();
  const list = game === SAMPLE_ID ? examples.filter((x) => (x.lang || "zh-Hant") === lang) : [];
  if (!list.length) { box.textContent = t.noExamples; return; }
  list.forEach((x) => {
    const b = el("button", "btn", x.label); b.style.cssText = "display:block;width:100%;text-align:left;margin-top:8px";
    b.onclick = () => render({ ...x.response, source: "recorded" }, x.mode);
    box.append(b);
  });
}

async function loadPresets() {
  let list = [];
  try { list = await (await fetch(`/api/presets?lang=${lang}`)).json(); } catch {}
  if (!list.some((p) => p.id === game)) game = list[0]?.id || SAMPLE_ID;
  const sel = $("game"); sel.replaceChildren();
  for (const p of list) { const o = el("option", null, p.title); o.value = p.id; o.selected = p.id === game; sel.append(o); }
  loadRulebook();
  renderExamples();
}
$("game").onchange = () => { game = $("game").value; $("out").replaceChildren(); loadRulebook(); renderExamples(); };

function applyLang(l) {
  lang = l; t = dict(l);
  applyI18n(t);
  document.title = fmt(t.tabRoomTitle, { title: t.soloNav });
  $("out").replaceChildren();
  renderH();
  loadPresets();
}
langSwitch($("langs"), applyLang);

fetch("/examples.json").then((r) => r.json()).then((list) => { examples = Array.isArray(list) ? list : []; renderExamples(); })
  .catch(() => { examples = []; renderExamples(); });

applyLang(lang);
</script>
</body>
</html>
