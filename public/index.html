<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>規則仲裁桌</title>
<meta name="description" content="兩人各說一句規則，AI 指出規則書哪一句支持誰；沒寫到的，全桌投票定房規。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2226%22 fill=%22%23f5b83d%22/%3E%3Cpath d=%22M50 18v62M32 80h36M24 34h52M24 34l-12 24a12 12 0 0 0 24 0zM76 34l-12 24a12 12 0 0 0 24 0z%22 fill=%22none%22 stroke=%22%231c2433%22 stroke-width=%227%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<meta name="theme-color" content="#233a5e">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="/"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v17M7 20h10M5 7h14M5 7l-3 6a3 3 0 0 0 6 0zM19 7l-3 6a3 3 0 0 0 6 0z"/></svg></span><span data-i18n="appName">規則仲裁桌</span></a>
  <span class="spacer"></span>
  <div class="langs" id="langs" role="group" aria-label="Language"></div>
</div></header>

<main>
  <section class="hero">
    <h1 data-i18n="heroTitle">吵規則，不如翻規則書</h1>
    <p data-i18n="heroBody"></p>
    <!-- 介紹影片：CSS 動畫做成，可播放、暫停、重播 -->
    <div class="vid">
      <div class="stage paused" id="stage" role="button" tabindex="0"></div>
      <div class="v-ctrl">
        <button class="v-btn" id="vbtn" type="button" aria-label="Play">▶</button>
        <div class="v-prog"><i id="vprog" style="width:0"></i></div>
        <span class="v-time" id="vtime">0:00 / 0:21</span>
      </div>
    </div>
  </section>

  <div class="door" id="door" role="tablist">
    <button type="button" data-v="create" class="on" role="tab" data-i18n="doorCreate"></button>
    <button type="button" data-v="join" role="tab" data-i18n="doorJoin"></button>
  </div>

  <section class="card" id="createCard">
    <h2 data-i18n="createTitle"></h2>
    <p class="muted" data-i18n="createDesc"></p>
    <label for="cname" data-i18n="yourName"></label>
    <input type="text" id="cname" maxlength="12" data-i18n-ph="namePhA">
    <label data-i18n="srcLabel"></label>
    <div class="seg" id="srcSeg">
      <button data-v="preset" class="on" type="button" data-i18n="srcPreset"></button>
      <button data-v="photo" type="button" data-i18n="srcPhoto"></button>
      <button data-v="paste" type="button" data-i18n="srcPaste"></button>
    </div>

    <div id="presetBox">
      <p class="muted small" id="presetsMsg" style="margin:8px 0 0"></p>
      <div class="presets" id="presets"></div>
      <p class="muted small" style="margin:8px 0 0" data-i18n="presetsNote"></p>
    </div>

    <div id="photoBox" hidden>
      <label class="drop" for="photoIn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.8l1.4-2h4.6l1.4 2h1.8A2.5 2.5 0 0 1 20 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5z"/><circle cx="12" cy="12.5" r="3.5"/></svg>
        <b data-i18n="photoDrop"></b>
        <span data-i18n="photoHint"></span>
      </label>
      <input type="file" id="photoIn" accept="image/*" multiple hidden>
      <div class="thumbs" id="thumbs"></div>
      <button class="btn acc block" id="ocrBtn" type="button" style="margin-top:12px" hidden></button>
      <p class="muted small" id="ocrMsg" style="margin:8px 0 0"></p>
    </div>

    <div id="pasteBox" hidden>
      <div class="warnbox small" id="reviewNote" hidden style="margin-top:12px" data-i18n="reviewNote"></div>
      <div class="trans" id="trans" hidden></div>
      <label for="ctitle" data-i18n="gameTitle"></label>
      <input type="text" id="ctitle" maxlength="30" data-i18n-ph="gameTitlePh">
      <label for="ctext" data-i18n="rulesText"></label>
      <textarea id="ctext" maxlength="20000" data-i18n-ph="rulesPh"></textarea>
      <div class="row" style="margin-top:6px"><span class="muted small grow" id="pcount"></span><button class="btn sm" id="pbtn" type="button" data-i18n="previewBtn"></button></div>
      <div id="pview" class="list-ev"></div>
    </div>
    <div id="cerr"></div>
    <button class="btn pri block" id="create" type="button" style="margin-top:16px" data-i18n="createBtn"></button>
  </section>

  <section class="card" id="joinCardHome" hidden>
    <h2 data-i18n="joinTitle"></h2>
    <p class="muted" data-i18n="joinDesc"></p>
    <label for="jcode" data-i18n="roomCode"></label>
    <input type="text" id="jcode" maxlength="6" data-i18n-ph="codePh" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase;letter-spacing:.2em;font-size:20px">
    <label for="jname" data-i18n="yourName"></label>
    <input type="text" id="jname" maxlength="12" data-i18n-ph="namePhB">
    <label data-i18n="role"></label>
    <div class="seg" id="roleSeg"><button data-v="player" class="on" type="button" data-i18n="rolePlayer"></button><button data-v="viewer" type="button" data-i18n="roleViewer"></button></div>
    <div id="jerr"></div>
    <button class="btn pri block" id="join" type="button" style="margin-top:16px" data-i18n="joinBtn"></button>
  </section>

  <section class="card">
    <div class="row">
      <div class="grow">
        <h3 style="margin:0 0 2px" data-i18n="soloTitle"></h3>
        <p class="muted small" style="margin:0" data-i18n="soloDesc"></p>
      </div>
      <a class="btn" href="/solo.html" data-i18n="soloBtn"></a>
    </div>
  </section>

  <p class="foot" data-i18n="foot"></p>
</main>

<script type="module">
import { $, el, deviceId, store, COLORS } from "/assets/common.js";
import { dict, fmt, getLang, applyI18n, langSwitch, detectLang } from "/assets/i18n.js";

let lang = getLang(), t = dict(lang);
let src = "preset", role = "player", preset = "night-market", presets = [];
const name = store("name") || "";
$("cname").value = name;
$("jname").value = name;

function seg(id, cb) {
  $(id).addEventListener("click", (e) => {
    const v = e.target.closest("button")?.dataset?.v; if (!v) return;
    [...$(id).children].forEach((b) => b.classList.toggle("on", b.dataset.v === v));
    cb(v);
  });
}
function showDoor(v) {
  [...$("door").children].forEach((b) => { b.classList.toggle("on", b.dataset.v === v); b.setAttribute("aria-selected", b.dataset.v === v); });
  $("createCard").hidden = v !== "create";
  $("joinCardHome").hidden = v !== "join";
}
seg("door", showDoor);
function showSrc(v) {
  src = v;
  $("presetBox").hidden = v !== "preset";
  $("photoBox").hidden = v !== "photo";
  $("pasteBox").hidden = v === "preset" || (v === "photo" && !$("ctext").value.trim());
  $("reviewNote").hidden = v !== "photo";
  showErr("cerr", "");
}
seg("srcSeg", showSrc);
seg("roleSeg", (v) => { role = v; });

function color() {
  let c = store("color");
  if (!COLORS.includes(c)) { c = COLORS[Math.floor(Math.random() * COLORS.length)]; store("color", c); }
  return c;
}
function showErr(id, msg) { const b = $(id); b.replaceChildren(); if (msg) { const e = el("div", "err", msg); e.style.marginTop = "12px"; b.append(e); } }
const post = (url, body) => fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });

// ---------- 語言 ----------
function applyLang(l) {
  lang = l; t = dict(l);
  applyI18n(t);
  document.title = t.appName;
  renderStage();
  $("pview").replaceChildren();
  showErr("cerr", ""); showErr("jerr", "");
  updateCount();
  renderThumbs();
  updateTrans();
  loadPresets();
}
langSwitch($("langs"), applyLang);

// ---------- 內建遊戲 ----------
async function loadPresets() {
  try {
    const r = await fetch(`/api/presets?lang=${lang}`);
    presets = await r.json();
    if (!Array.isArray(presets)) throw 0;
    $("presetsMsg").textContent = "";
  } catch { presets = []; $("presetsMsg").textContent = t.presetsFail; }
  if (!presets.some((p) => p.id === preset)) preset = presets[0]?.id || "";
  renderPresets();
}
function renderPresets() {
  const box = $("presets"); box.replaceChildren();
  for (const p of presets) {
    const w = p.weight || 1;
    const b = el("div", "preset" + (p.id === preset ? " on" : ""));
    b.setAttribute("role", "button"); b.tabIndex = 0;
    const top = el("div", "pt");
    const icon = el("span", "pi", p.icon); icon.style.background = p.color;
    const mid = el("div", "grow");
    const meta = el("div", "pm");
    meta.append(el("span", null, `👥 ${p.players}`));
    if (p.time) meta.append(el("span", null, `⏱️ ${fmt(t.minutes, { n: p.time })}`));
    meta.append(el("span", null, "●●●".slice(0, w) + "○○○".slice(0, 3 - w) + " " + t["weight" + w]));
    mid.append(el("b", null, p.title), meta);
    top.append(icon, mid);
    if (p.id === preset) top.append(el("span", "ck2", "✓"));
    const more = el("a", "more", t.seeIntro); more.href = `/game.html?id=${p.id}`;
    more.onclick = (e) => e.stopPropagation();
    b.append(top, el("div", "ps", p.summary), more);
    b.onclick = () => { preset = p.id; renderPresets(); };
    b.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); b.click(); } };
    box.append(b);
  }
}

// ---------- 介紹影片：6 段動畫，每段 3.5 秒 ----------
const SCENE_MS = 3500, TOTAL = SCENE_MS * 6;
const vid = { started: false, playing: false, ended: false, scene: -1, elapsed: 0, last: 0, timer: null };
const sec = (ms) => `0:${String(Math.floor(ms / 1000)).padStart(2, "0")}`;
function sceneEl(n) {
  const sc = el("div", "sc");
  const logo = (cls = "") => el("div", "v-logo vpop " + cls, "⚖️");
  const avA = el("span", "av", [...t.demoNameA][[..."阿小老大"].includes(t.demoNameA[0]) ? 1 : 0]); avA.style.background = "#2b6cb0";
  const avB = el("span", "av", [...t.demoNameB][[..."阿小老大"].includes(t.demoNameB[0]) ? 1 : 0]); avB.style.background = "#b83280";
  if (n === 0) {
    const faces = el("div", "v-faces"); faces.append(el("span", "shake d1", "😤"), el("span", "shake d2", "😠"));
    sc.append(logo(), el("div", "v-name vpop d1", t.appName), faces);
  } else if (n === 1) {
    const a = el("div", "v-say in-l"); a.append(avA, el("div", "v-bub", t.demoSayA));
    const b = el("div", "v-say r in-r d2"); b.append(avB, el("div", "v-bub", t.demoSayB));
    sc.append(a, b);
  } else if (n === 2) {
    const book = el("div", "v-book in-up");
    const hl = el("div", "v-hl"); hl.append(el("span", "cid", "4.2-2"), el("span", null, t.demoQuote));
    book.append(el("div", "v-book-h", `📖 ${t.vRulebook}`), el("div", "v-line"), hl, el("div", "v-line s"));
    const v = el("div", "v-verdict vdrop d3"); v.append(el("span", "kind k-explicit", t.kind.explicit), el("div", "v-vm", t.demoVerdict));
    sc.append(book, v);
  } else if (n === 3) {
    const vote = el("div", "v-vote in-up");
    const opt = (label, cls) => { const o = el("div", "v-opt"); const bar = el("div", "v-bar"); bar.append(el("div", "v-fill " + cls)); o.append(el("span", null, label), bar); return o; };
    vote.append(el("div", "v-q", `🗳️ ${t.vVoteQ}`), opt(t.vVoteA, "a"), opt(t.vVoteB, "b"), el("div", "v-pass vpop d3", t.vPassed));
    sc.append(vote);
  } else if (n === 4) {
    const feats = el("div", "v-feats");
    [["📷", t.featPhoto, ""], ["🌐", t.featTranslate, "d1"], ["🎲", t.featPresets, "d2"], ["🔤", t.featLangs, "d3"]].forEach(([i, l, d]) => {
      const f = el("div", "v-feat vpop " + d); f.append(el("span", "v-fi", i), el("span", null, l)); feats.append(f);
    });
    sc.append(feats);
  } else {
    sc.append(logo(), el("div", "v-cta vpop d1", t.createBtn));
  }
  return sc;
}
function renderStage() {
  const st = $("stage"); st.replaceChildren();
  st.classList.toggle("paused", !vid.playing);
  st.setAttribute("aria-label", t.videoTitle);
  if (!vid.started) {
    const p = el("div", "poster"); p.append(el("div", "v-logo", "⚖️"), el("div", "poster-t", t.videoTitle), el("div", "play-big", "▶"));
    st.append(p);
  } else {
    if (vid.scene >= 0) st.append(sceneEl(vid.scene), el("div", "cap", t["v" + (vid.scene + 1)]));
    if (vid.ended) { const e = el("div", "ended"); e.append(el("div", "play-big", "↻")); st.append(e); }
  }
  $("vbtn").textContent = vid.ended ? "↻" : vid.playing ? "❚❚" : "▶";
  $("vbtn").setAttribute("aria-label", vid.ended ? t.replay : vid.playing ? t.pause : t.play);
}
function tick() {
  const now = performance.now();
  if (vid.playing) vid.elapsed += now - vid.last;
  vid.last = now;
  if (vid.elapsed >= TOTAL) {
    clearInterval(vid.timer); vid.playing = false; vid.ended = true; vid.elapsed = TOTAL;
    $("vprog").style.width = "100%"; $("vtime").textContent = `${sec(TOTAL)} / ${sec(TOTAL)}`;
    renderStage(); return;
  }
  const scene = Math.floor(vid.elapsed / SCENE_MS);
  $("vprog").style.width = `${(vid.elapsed / TOTAL) * 100}%`;
  $("vtime").textContent = `${sec(vid.elapsed)} / ${sec(TOTAL)}`;
  if (scene !== vid.scene) { vid.scene = scene; renderStage(); }
}
function play() { vid.playing = true; vid.last = performance.now(); clearInterval(vid.timer); vid.timer = setInterval(tick, 100); $("stage").classList.remove("paused"); renderBtn(); }
function pause() { vid.playing = false; clearInterval(vid.timer); $("stage").classList.add("paused"); renderBtn(); }
function renderBtn() { $("vbtn").textContent = vid.ended ? "↻" : vid.playing ? "❚❚" : "▶"; $("vbtn").setAttribute("aria-label", vid.playing ? t.pause : t.play); }
function toggleVideo() {
  if (!vid.started || vid.ended) { Object.assign(vid, { started: true, ended: false, elapsed: 0, scene: -1 }); play(); tick(); return; }
  vid.playing ? pause() : play();
}
$("stage").onclick = toggleVideo;
$("stage").onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleVideo(); } };
$("vbtn").onclick = toggleVideo;
document.addEventListener("visibilitychange", () => { if (document.hidden && vid.playing) pause(); });

// ---------- 貼上文字與預覽 ----------
function updateCount() { $("pcount").textContent = fmt(t.charCount, { n: $("ctext").value.length }); }
$("ctext").addEventListener("input", () => { updateCount(); updateTrans(); });
$("pbtn").onclick = async () => {
  const r = await post("/api/preview", { text: $("ctext").value, lang });
  const d = await r.json();
  const box = $("pview"); box.replaceChildren();
  if (!r.ok) { box.append(el("div", "err", d.message || t.previewFail)); return; }
  box.append(el("p", "muted small", fmt(t.previewHead, { n: d.count })));
  d.sentences.forEach((s) => { const row = el("div", "ev"); row.append(el("span", "cid", s.sid), el("span", null, s.text)); box.append(row); });
  if (d.count > d.sentences.length) box.append(el("p", "muted small", fmt(t.previewMore, { n: d.count - d.sentences.length })));
};

// ---------- 預設翻譯：規則書語言跟介面不同時，建立房間前先翻譯 ----------
const CHUNK = 3000;
const tr = { on: true, busy: false, done: false, orig: "", err: "", busyText: "" };
function chunksOf(text) {
  const out = []; let buf = [], len = 0;
  for (const line of text.split("\n")) {
    if (line.length > CHUNK) { if (buf.length) { out.push(buf.join("\n")); buf = []; len = 0; } for (let i = 0; i < line.length; i += CHUNK) out.push(line.slice(i, i + CHUNK)); continue; }
    if (len + line.length + 1 > CHUNK && buf.length) { out.push(buf.join("\n")); buf = []; len = 0; }
    buf.push(line); len += line.length + 1;
  }
  if (buf.length) out.push(buf.join("\n"));
  return out;
}
function needsTrans() {
  const d = detectLang($("ctext").value);
  return d && d !== lang ? d : null;
}
function updateTrans() {
  const box = $("trans"); box.replaceChildren();
  const detected = needsTrans();
  box.hidden = !tr.busy && !tr.done && !detected;
  if (box.hidden) return;
  const target = t.langName[lang];
  if (tr.busy) {
    const p = el("div", "pending"); p.style.marginTop = "0"; p.append(el("span", "spin"), el("span", null, tr.busyText)); box.append(p);
  } else if (tr.done) {
    box.append(el("div", null, fmt(t.transDone, { lang: target })));
    const row = el("div", "row"); row.append(el("span", "small grow", t.transNote));
    const undo = el("button", "btn sm", t.transUndo); undo.type = "button";
    undo.onclick = () => { $("ctext").value = tr.orig; tr.done = false; updateCount(); updateTrans(); };
    row.append(undo); box.append(row);
  } else {
    box.append(el("div", null, fmt(t.transDetected, { lang: t.langName[detected] || t.langName.other })));
    const row = el("div", "row");
    const lbl = el("label"); const cb = el("input"); cb.type = "checkbox"; cb.checked = tr.on; cb.onchange = () => { tr.on = cb.checked; };
    lbl.append(cb, el("span", null, fmt(t.transToggle, { lang: target })));
    const go = el("button", "btn sm", t.transNow); go.type = "button"; go.onclick = () => translate();
    row.append(lbl, el("span", "grow"), go); box.append(row);
    if (tr.err) { const e = el("div", "err", tr.err); e.style.marginTop = "8px"; box.append(e); }
  }
}
async function translate() {
  if (tr.busy) return false;
  const text = $("ctext").value, parts = chunksOf(text), out = [];
  tr.busy = true; tr.err = ""; showErr("cerr", "");
  $("create").disabled = true;
  try {
    for (let i = 0; i < parts.length; i++) {
      tr.busyText = fmt(t.transBusy, { i: i + 1, n: parts.length }); updateTrans();
      if (!parts[i].trim()) { out.push(parts[i]); continue; }
      let r, d;
      try { r = await post("/api/translate", { text: parts[i], to: lang, lang }); d = await r.json(); }
      catch { r = { ok: false }; d = { message: t.netFail }; }
      if (!r.ok) { tr.err = fmt(t.transFail, { err: d.message || t.errGeneric }); return false; }
      out.push(d.text);
    }
    tr.orig = text; tr.done = true;
    $("ctext").value = out.join("\n"); $("pview").replaceChildren(); updateCount();
    return true;
  } finally {
    tr.busy = false; $("create").disabled = false; updateTrans();
  }
}

// ---------- 拍照上傳 ----------
const MAX_PAGES = 8;
let photos = [];   // { file, url, status: "idle" | "busy" | "ok" | "fail", text, err }
let ocrRunning = false;

$("photoIn").addEventListener("change", (e) => {
  const files = [...e.target.files].filter((f) => f.type.startsWith("image/"));
  const room = MAX_PAGES - photos.length;
  $("ocrMsg").textContent = files.length > room ? fmt(t.ocrMax, { n: MAX_PAGES }) : "";
  files.slice(0, room).forEach((file) => photos.push({ file, url: URL.createObjectURL(file), status: "idle" }));
  e.target.value = "";
  renderThumbs();
});

function renderThumbs() {
  const box = $("thumbs"); box.replaceChildren();
  photos.forEach((p, i) => {
    const th = el("div", "thumb" + (p.status === "ok" ? " ok" : p.status === "fail" ? " fail" : p.status === "busy" ? " busy" : ""));
    const img = el("img"); img.src = p.url; img.alt = String(i + 1);
    th.append(img, el("span", "pg", String(i + 1)));
    if (!ocrRunning) {
      const x = el("button", "x", "×"); x.type = "button"; x.setAttribute("aria-label", `${t.del} ${i + 1}`);
      x.onclick = () => { URL.revokeObjectURL(p.url); photos.splice(i, 1); renderThumbs(); };
      th.append(x);
    }
    if (p.status === "busy") th.append(el("span", "st", t.thumbBusy));
    if (p.status === "ok") th.append(el("span", "st", t.thumbOk));
    if (p.status === "fail") th.append(el("span", "st", t.thumbFail));
    box.append(th);
  });
  const todo = photos.filter((p) => p.status !== "ok").length;
  $("ocrBtn").hidden = !todo;
  $("ocrBtn").disabled = ocrRunning;
  $("ocrBtn").textContent = ocrRunning ? t.ocrBtnBusy : photos.some((p) => p.status === "fail") ? fmt(t.ocrBtnRetry, { n: todo }) : fmt(t.ocrBtn, { n: todo });
}

// 縮小照片再上傳：最長邊 2000px，JPEG
async function compress(file) {
  let bmp;
  try { bmp = await createImageBitmap(file); }
  catch {
    bmp = await new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = URL.createObjectURL(file); });
  }
  const w = bmp.width, h = bmp.height, k = Math.min(1, 2000 / Math.max(w, h));
  const c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.85);
}

$("ocrBtn").onclick = async () => {
  if (ocrRunning) return;
  ocrRunning = true;
  for (const p of photos) {
    if (p.status === "ok") continue;
    p.status = "busy"; renderThumbs();
    $("ocrMsg").textContent = fmt(t.ocrProgress, { n: photos.indexOf(p) + 1 });
    try {
      const r = await post("/api/ocr", { image: await compress(p.file), lang });
      const d = await r.json();
      if (r.ok) { p.status = "ok"; p.text = d.text; p.err = null; }
      else { p.status = "fail"; p.err = d.message || t.ocrFailGeneric; if (r.status === 429 || d.error === "no_key" || d.error === "no_vision") { ocrRunning = false; break; } }
    } catch { p.status = "fail"; p.err = t.netFail; }
    renderThumbs();
  }
  ocrRunning = false;
  const done = photos.filter((p) => p.status === "ok");
  const failed = photos.filter((p) => p.status === "fail");
  if (done.length) {
    $("ctext").value = done.map((p) => p.text).join("\n");
    tr.done = false;
    updateCount();
    $("pasteBox").hidden = false;
  }
  const unclear = ($("ctext").value.match(/〔看不清〕/g) || []).length;
  $("ocrMsg").textContent = failed.length
    ? fmt(t.ocrFailPages, { pages: failed.map((p) => photos.indexOf(p) + 1).join(t.listSep), err: failed[0].err })
    : done.length ? fmt(t.ocrDone, { n: done.length, extra: unclear ? fmt(t.ocrUnclear, { n: unclear }) : "" }) : "";
  renderThumbs();
  updateTrans();
  // 預設翻譯：辨識完就直接翻
  if (done.length && needsTrans() && tr.on) translate();
};

// ---------- 建立與加入 ----------
$("create").onclick = async () => {
  const n = $("cname").value.trim();
  if (!n) return showErr("cerr", t.errName);
  const body = { device: deviceId(), name: n, color: color(), lang };
  if (src === "preset") {
    if (!preset) return showErr("cerr", t.errPickPreset);
    body.preset = preset;
  } else {
    const text = $("ctext").value;
    if (!text.trim()) return showErr("cerr", src === "photo" ? t.errNeedPhoto : t.errNeedPaste);
    if (needsTrans() && tr.on && !tr.done) {
      if (await translate()) showErr("cerr", t.transReview);
      return;
    }
    const unclear = ($("ctext").value.match(/〔看不清〕/g) || []).length;
    if (unclear) return showErr("cerr", fmt(t.errUnclear, { n: unclear }));
    body.title = $("ctitle").value;
    body.rulebook = $("ctext").value;
  }
  store("name", n);
  $("create").disabled = true; $("create").textContent = t.creating;
  try {
    const r = await post("/api/rooms", body);
    const d = await r.json();
    if (!r.ok) return showErr("cerr", d.message || t.errCreate);
    location.href = `/room.html?c=${d.code}`;
  } catch { showErr("cerr", t.netFail); }
  finally { $("create").disabled = false; $("create").textContent = t.createBtn; }
};

$("join").onclick = async () => {
  const code = $("jcode").value.trim().toUpperCase();
  const n = $("jname").value.trim();
  if (!/^[A-Z0-9]{6}$/.test(code)) return showErr("jerr", t.errCode);
  if (!n) return showErr("jerr", t.errName);
  store("name", n);
  const r = await fetch(`/api/rooms/${code}?lang=${lang}`);
  if (!r.ok) return showErr("jerr", t.errNoRoom);
  location.href = `/room.html?c=${code}&role=${role}`;
};

// 從遊戲介紹頁按「用這款開房」過來：?preset=遊戲
const qp = new URLSearchParams(location.search).get("preset");
if (qp) preset = qp;
const q = new URLSearchParams(location.search).get("c");
if (q) { $("jcode").value = q.toUpperCase(); showDoor("join"); }
applyLang(lang);
</script>
